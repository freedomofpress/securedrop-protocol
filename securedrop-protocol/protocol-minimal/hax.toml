[scenario.securedrop-protocol-minimal]
backend = "lean"
output-dir = "proofs/lean"

# Exclusions should mirror "-" exclusions defined in HAX_TARGETS.  Everything
# else is included.
#
# TODO: Revisit these under Aeneas.
exclude = [
    "securedrop_protocol_minimal::server::session",
    "securedrop_protocol_minimal::server::storage",

    "securedrop_protocol_minimal::api::Api",
    "{impl securedrop_protocol_minimal::api::Api for _}",
    "securedrop_protocol_minimal::api::JournalistApi",
    "{impl securedrop_protocol_minimal::api::JournalistApi for _}",
]

# FIXME: The following need to be opaque (i.e., extract their signatures, not
# their bodies) and resolved case by case for Aeneas compatibility:
opaque = [
    "securedrop_protocol_minimal::client::challenge::solve_fetch_challenges",
    "securedrop_protocol_minimal::client::message::decrypt_with_sender",
    "securedrop_protocol_minimal::client::message::decrypt",
    "securedrop_protocol_minimal::schemes::message::auth_dec",
    "securedrop_protocol_minimal::schemes::message::auth_enc",
    "securedrop_protocol_minimal::schemes::metadata::_::from_bytes",
    "securedrop_protocol_minimal::schemes::metadata::decrypt",
    "securedrop_protocol_minimal::schemes::sign::{impl securedrop_protocol_minimal::schemes::sign::DomainTag for _}::tag",
    "securedrop_protocol_minimal::server::challenge::compute_fetch_challenges",
    "{impl securedrop_protocol_minimal::traits::UserSecret for securedrop_protocol_minimal::source::Source}::keybundles",
]
