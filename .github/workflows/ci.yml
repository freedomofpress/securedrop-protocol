name: CI

on: [push, pull_request]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # any cargo or rust command will do
      - run: rustup toolchain install
      # lint-tools/.crates.toml is autogenerated and will change on version bump
      - name: Cache lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-deps
        with:
          path: |
            lint-tools
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: lint-tools-${{ hashFiles('lint-tools/versions.env') }}
      - name: Install lint deps, if needed
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make deps-lint
      - run: make lint
      - name: Run actionlint
        uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e  # v1.74.0

  # Run the `cargo deny` action, which uses deny.toml to check that dependencies comply
  # with policies around licensing, version deduplication, and address RUSTSEC advisories.
  # Suggested action matrix per https://github.com/EmbarkStudios/cargo-deny-action.
  # To run locally, `cargo install cargo deny`, then `cargo deny check`
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Action@v2.1.1
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
      with:
        command: check ${{ matrix.checks }}
        manifest-path: securedrop-protocol/Cargo.toml


      
