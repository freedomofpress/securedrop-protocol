name: CI

on: [push, pull_request]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Bootstrap Debian system package dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            git \
            make \
            curl \
            ca-certificates \
            build-essential \
            pkg-config \
            libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain@30dc51db75d080812bc4a28ba3f342840b2e7dd7
      # (rust-toolchain@v1 latest reviewed and pinned)
      - uses: dtolnay/rust-toolchain@30dc51db75d080812bc4a28ba3f342840b2e7dd7
        with:
          toolchain: stable
          components: clippy,rustfmt
      # lint-tools/.crates.toml is autogenerated and will change on version bump
      - name: Cache lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-deps
        with:
          path: |
            lint-tools
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: lint-tools-${{ hashFiles('lint-tools/versions.env') }}
      - name: Install lint deps, if needed
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make deps-lint
      - run: make lint
  
  # Run the `cargo deny` action, which uses deny.toml to check that dependencies comply
  # with policies around licensing, version deduplication, and address RUSTSEC advisories.
  # Suggested action matrix per https://github.com/EmbarkStudios/cargo-deny-action.
  # To run locally, `cargo install cargo deny`, then `cargo deny check`
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Action@v2.1.1
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
      with:
        command: check ${{ matrix.checks }}
        manifest-path: securedrop-protocol/Cargo.toml


      
