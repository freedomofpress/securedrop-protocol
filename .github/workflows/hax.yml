name: hax

# Schedule this workflow once a day or when there are changes to relevant files
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - securedrop-protocol/Cargo.lock
      - securedrop-protocol/protocol-minimal/proofs/**
      - securedrop-protocol/protocol-minimal/src/**
  pull_request:
    paths:
      - securedrop-protocol/Cargo.lock
      - securedrop-protocol/protocol-minimal/proofs/**
      - securedrop-protocol/protocol-minimal/src/**

permissions:
  contents: read
  pull-requests: read

jobs:
  check-extraction-targets:
    name: Check libcrux extraction targets are up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain@30dc51db75d080812bc4a28ba3f342840b2e7dd7
      - uses: dtolnay/rust-toolchain@30dc51db75d080812bc4a28ba3f342840b2e7dd7
        with:
          toolchain: nightly

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check libcrux extraction targets (warn only)
        run: |
          if ! make check-targets; then
            echo "::warning:: libcrux extraction targets may be out of date. Run 'make update-targets' in proofs/fstar/models"
          fi
        working-directory: securedrop-protocol/protocol-minimal

  verify:
    name: Extract and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve tool versions
        id: versions
        run: |
          . ./versions.env
          hax=$(make --silent hax-lib-version)
          [ -n "$FSTAR_VER" ] || { echo "::error::no FSTAR_VER in versions.env"; exit 1; }
          [ -n "$hax" ] || { echo "::error::could not determine the hax-lib version"; exit 1; }
          echo "fstar=$FSTAR_VER" >> "$GITHUB_OUTPUT"
          echo "hax=$hax" >> "$GITHUB_OUTPUT"
        working-directory: securedrop-protocol/protocol-minimal

      - name: Set up hax
        uses: hacspec/hax-actions@6c734302f9a0434cf590e0ba18c9dd9b28fc6659
        with:
          fstar: v${{ steps.versions.outputs.fstar }}
          hax_reference: cargo-hax-v${{ steps.versions.outputs.hax }}

      - name: Extract F*
        run: make clean extract
        working-directory: securedrop-protocol/protocol-minimal

      - name: Confirm no diff from committed proofs
        run: git diff --exit-code .
        working-directory: securedrop-protocol/protocol-minimal/proofs

      - name: Type-check and verify
        run: make verify
        working-directory: securedrop-protocol/protocol-minimal

      - name: Libcrux extraction completes and is reproducible
        run: |
          make libcrux
          git diff --exit-code .
        working-directory: securedrop-protocol/protocol-minimal/proofs/fstar/models
